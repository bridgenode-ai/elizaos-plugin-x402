name: Publish to npm

# Token-based publish (NPM_TOKEN secret) — kaip C2 sprendimas.
# OIDC provenance badge atidėtas į P23 (npm org/scope setup reikalingas).
# Trigger: tag `v*` (release-please arba rankinis `git tag v0.1.0 && push`).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Authenticate with npm
        run: npm config set "//registry.npmjs.org/:_authToken" "${{ secrets.NPM_TOKEN }}"

      - name: Publish (skip if version already published)
        run: |
          npm ci
          npm run build
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "Version $PKG_VER of $PKG_NAME already published — skipping"
          else
            npm publish --access public
          fi
